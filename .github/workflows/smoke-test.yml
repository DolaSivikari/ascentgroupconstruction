name: Smoke Tests

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Cache locked dependency downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.11-${{ hashFiles('bun.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Install project dependencies
        run: node scripts/install-ci-dependencies.mjs

      - name: Check operational inputs and types
        run: |
          node scripts/check-operational-contracts.mjs
          npm run typecheck:selected
          node node_modules/typescript/bin/tsc -p tsconfig.app.json --noEmit
      - name: Enforce lint debt without new violations
        run: node scripts/check-lint-budget.mjs

      - name: Run regression tests
        run: node node_modules/vitest/vitest.mjs run

      - name: Build current branch
        env:
          ENABLE_IMAGE_OPTIMIZATION: "false"
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Check initial JavaScript budget
        run: node scripts/check-entry-budget.mjs

      - name: Run smoke tests against this build
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ -o /dev/null; then break; fi
            sleep 1
          done
          set -o pipefail
          bash scripts/smoke-test.sh http://127.0.0.1:4173 2>&1 | tee smoke.log

      - name: Run route audit
        run: |
          set -o pipefail
          bun scripts/audit-routes.ts 2>&1 | tee routes.log

      - name: Validate service worker
        run: npm run validate:sw

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            build.log
            preview.log
            smoke.log
            routes.log

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Smoke tests failed! Check the logs for details."

  production-availability:
    # Production availability is separate from testing code that is not deployed yet.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read-only production availability
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: bash scripts/smoke-test.sh https://www.ascentgroupconstruction.com

  project-save-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Test draft SQL against a disposable schema
        env:
          DATABASE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$DATABASE_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < scripts/sql/project-save-fixture.sql
          docker exec -i "$DATABASE_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < docs/operations/sql/save-project-atomic.sql
          docker exec -i "$DATABASE_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < scripts/sql/project-save-check.sql
